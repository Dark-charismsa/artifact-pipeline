# Replaces the Deployment. Same pod template; a different controller
# (Argo Rollouts, not the built-in Deployment controller) drives it, and
# updates roll out through canary steps instead of all at once.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello-deploy
spec:
  replicas: 5
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: ghcr.io/dark-charismsa/artifact-pipeline@sha256:b994838530c9673f40106610f5a46cbb888447c37089aa2388da54e376a2fd9a
          env:
            - name: LATENCY_MS
              value: "50"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: hello-error-rate
                args:
                  - name: canary-hash
                    valueFrom:
                      podTemplateHashValue: Latest
        - setWeight: 60
        - pause: { duration: 30s }
        - setWeight: 100
